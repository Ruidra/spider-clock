name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VER_STRING=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VER_STRING"

          if [ -z "$JAVA_VER_STRING" ]; then
            echo "ERROR: Java version cannot be detected."
            exit 1
          fi

          JAVA_MAJOR=$(echo "$JAVA_VER_STRING" | awk -F. '{if ($1 == "1") {print $2} else {print $1}}')
          echo "Detected Java major version: $JAVA_MAJOR"

          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not parse numeric Java major version from '$JAVA_VER_STRING'."
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java major version ($JAVA_MAJOR) is lower than required version 17."
            exit 1
          fi

          echo "Java environment verified: Java $JAVA_MAJOR (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Temporary Debug Keystore Check ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in workspace."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore confirmed."

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK does not exist at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk for any APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk not found."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is an empty file."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: $EXPECTED_APK does not have a .apk extension."
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "Debug APK successfully verified at: $EXPECTED_APK"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release
        run: |
          echo "=== Preparing APK Release Asset ==="
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9._-]/-/g' -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="android-app"
          fi

          RELEASE_FILENAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_ASSET_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$TEMP_ASSET_DIR"

          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TARGET_APK="${TEMP_ASSET_DIR}/${RELEASE_FILENAME}"

          cp "$SOURCE_APK" "$TARGET_APK"

          if [ ! -f "$TARGET_APK" ] || [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: Release asset copy failed or is empty: $TARGET_APK"
            exit 1
          fi

          echo "Prepared release asset: $TARGET_APK"
          echo "asset_path=$TARGET_APK" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Checking GitHub CLI Availability ==="
          gh --version
          if ! command -v gh &> /dev/null; then
            echo "ERROR: GitHub CLI (gh) is not available."
            exit 1
          fi

          ASSET_PATH="${{ steps.prepare_release.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist at $ASSET_PATH"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset is empty at $ASSET_PATH"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset does not have .apk extension: $ASSET_PATH"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE=$(mktemp)
          {
            echo "### Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo ""
            echo "- **Build Type**: Automatically generated debug APK"
            echo "- **Builder**: GitHub Actions"
            echo "- **Workflow Run Number**: ${GITHUB_RUN_NUMBER}"
            echo "- **Workflow Run Attempt**: ${GITHUB_RUN_ATTEMPT}"
            echo "- **Source Commit SHA**: ${GITHUB_SHA}"
            echo "- **Intended Use**: Testing and preview purposes"
            echo "- **Production Status**: Not a Play Store production release"
            echo "- **Signing**: Signed only with a temporary debug keystore"
            echo ""
            echo "Directly download the attached APK file from the Assets section below onto your Android phone to install."
          } > "$NOTES_FILE"

          echo "Publishing release: tag=$RELEASE_TAG, title=$RELEASE_TITLE"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest
          rm -f "$NOTES_FILE"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prepare_release.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== Release Publishing Succeeded ==="
            RELEASE_VIEW_JSON=$(gh release view "$RELEASE_TAG" --json url,tagName,title 2>/dev/null || echo "{}")
            RELEASE_URL=$(echo "$RELEASE_VIEW_JSON" | jq -r '.url // empty')
            RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            {
              echo "## 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "### 📱 Direct Phone Download via GitHub Release"
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **Release Title**: $RELEASE_TITLE"
              if [ -n "$RELEASE_URL" ]; then
                echo "- **Direct Release Page**: [Download APK from Release]($RELEASE_URL)"
              fi
              echo "- **APK Asset File**: \`$ASSET_NAME\`"
              echo ""
              echo "> 📲 **How to install on phone**: Visit the release link above, scroll to **Assets**, tap \`$ASSET_NAME\`, and install the APK on your device."
              echo ""
              echo "---"
              echo "### 📦 Backup Actions Artifact"
              echo "The standard GitHub Actions artifact named \`app-debug-apk\` is also available under the Summary section of this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was not completed or encountered an error."
            echo "The debug APK build succeeded and the artifact named 'app-debug-apk' remains available."

            {
              echo "## ⚠️ Debug APK Build Summary"
              echo ""
              echo "- **APK Build**: ✅ Succeeded"
              echo "- **GitHub Actions Artifact**: ✅ \`app-debug-apk\` uploaded and available"
              echo "- **GitHub Release**: ⚠️ Publishing was not completed"
              echo ""
              echo "> 📦 **Backup Download**: You can download the debug APK directly from the **Artifacts** section of this GitHub Actions run (\`app-debug-apk\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
